 services:
  todoapp-postgres:
    image: postgres:18.1-bookworm
    container_name: todoapp-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}   
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}   
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql

    deploy:
      resources:
        limits:
          memory: 512M  # Максимально допустимая память
        reservations:
          memory: 256M 
    restart: always   
  
  
  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
    - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
    deploy:
      resources:
        limits:
          memory: 512M  # Максимально допустимая память
        reservations:
          memory: 256M 
    ports:
      - "127.0.0.1:5432:5432"
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - default
 volumes:
   postgres_test_data:
     driver: local